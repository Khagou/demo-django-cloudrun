name: Deploy
env:
  CODE_PROJET: 1590 
  IMPERSONATE_SA: demo-django-cloudrun-rw@kh-prod-iac-core-0.iam.gserviceaccount.com
  FAST_SERVICE_ACCOUNT: demo-django-cloudrun-cicd-rw@kh-prod-iac-core-0.iam.gserviceaccount.com
  FAST_SERVICE_ACCOUNT_PLAN: demo-django-cloudrun-cicd-ro@kh-prod-iac-core-0.iam.gserviceaccount.com
  FAST_WIF_PROVIDER: projects/754374235228/locations/global/workloadIdentityPools/github-pool/providers/github
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  TF_PROVIDERS_FILE: demo-django-cloudrun-providers.tf
  TF_PROVIDERS_FILE_PLAN: demo-django-cloudrun-ro-providers.tf
  TF_VERSION: 1.12.2
  PROJECT_ID: gothic-guard-485708-c1
  REGION: europe-west1
  AR_REPO: demo
  SERVICE_NAME: django-demo
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Env cible"
        type: choice
        required: true
        options:
          - dev
          - qualif
          - recette
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - run: echo "Deploy sur ${{ inputs.environment }}"

  fast-pr:
    # Skip PRs which are closed without being merged.
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4

      # set up step variables for plan / apply

      - id: vars-plan
        if: github.ref == 'refs/heads/dev'
        name: Set up plan variables
        run: |
          echo "plan_opts=-lock=false" >> "$GITHUB_ENV"
          echo "environment=${{inputs.environment}}" >> "$GITHUB_ENV"
          echo "service_account=${{env.FAST_SERVICE_ACCOUNT_PLAN}}" >> "$GITHUB_ENV"

      - id: vars-apply
        if: github.ref == 'refs/heads/main'
        name: Set up apply variables
        run: |
          echo "environment=${{inputs.environment}}" >> "$GITHUB_ENV"
          echo "service_account=${{env.FAST_SERVICE_ACCOUNT}}" >> "$GITHUB_ENV"



      # set up authentication via Workload identity Federation and gcloud

      - id: gcp-auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{env.FAST_WIF_PROVIDER}}
          service_account: ${{env.service_account}}
          access_token_lifetime: 900s

      - id: gcp-sdk
        name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: alpha

      - id: tf-config-provider
        name: Config Terraform provider file
        run: |
            sed -i "s|<CODE_PROJET>|${CODE_PROJET}|g" provider.tf
            sed -i "s|<ENV>|${environment}|g" provider.tf
            sed -i "s|<SA_NAME>|${IMPERSONATE_SA}|g" provider.tf

      - id: debug-stage
        name: Debug Stage
        run: |
            echo $ENV
            cat provider.tf
            echo $GCP_VIEW
            echo $SERVICE_ACCOUNT
            echo $IMPERSONATE_SA

      - id: tf-setup
        name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{env.TF_VERSION}}

      # run Terraform init/validate/plan

      - id: tf-init
        name: Terraform init
        continue-on-error: true
        run: |
          cd terraform
          terraform init -no-color

      - id: tf-validate
        continue-on-error: true
        name: Terraform validate
        run: |
          cd terraform
          terraform validate -no-color

      - id: docker-auth
        if: github.event.pull_request.merged == true && success()
        name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth print-access-token \
          --impersonate-service-account  ${{ env.IMPERSONATE_SA}} | docker login \
          -u oauth2accesstoken \
          --password-stdin https://${{ env.REGION }}-docker.pkg.dev

      - id: docker-build-push
        if: github.event.pull_request.merged == true && success()
        name: Build & push Docker image
        run: |
          docker build -t "${{ env.image }}" .
          docker push "${{ env.image }}"


      - id: tf-plan
        name: Terraform plan
        continue-on-error: true
        run: |
          cd terraform
          terraform plan -input=false -out ../plan.out -no-color ${{env.plan_opts}} -var="image=${{ env.image }}"

      - id: tf-apply
        name: Terraform apply
        continue-on-error: true
        run: |
          cd terraform
          terraform apply -input=false -auto-approve -no-color -var="image=${{ env.image }}" ../plan.out 

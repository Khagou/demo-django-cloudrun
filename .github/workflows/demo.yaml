name: "FAST demo-django-setup stage"

on:
  push:
    branches:
        - dev
  pull_request:
    branches:
      - main
    types:
      - closed


env:
  FAST_SERVICE_ACCOUNT: demo-django-cloudrun-cicd-rw@kh-prod-iac-core-0.iam.gserviceaccount.com
  FAST_SERVICE_ACCOUNT_PLAN: demo-django-cloudrun-cicd-ro@kh-prod-iac-core-0.iam.gserviceaccount.com
  FAST_WIF_PROVIDER: projects/754374235228/locations/global/workloadIdentityPools/github-pool/providers/github
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock
  TF_PROVIDERS_FILE: demo-django-cloudrun-providers.tf
  TF_PROVIDERS_FILE_PLAN: demo-django-cloudrun-ro-providers.tf
  TF_VERSION: 1.12.2
  PROJECT_ID: gothic-guard-485708-c1
  REGION: europe-west1
  AR_REPO: demo
  SERVICE_NAME: django-demo

jobs:
  fast-pr:
    # Skip PRs which are closed without being merged.
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@v4

      # set up step variables for plan / apply

      - id: vars-plan
        if: github.event.pull_request.merged != true && success()
        name: Set up plan variables
        run: |
          echo "plan_opts=-lock=false" >> "$GITHUB_ENV"
          echo "provider_file=${{env.TF_PROVIDERS_FILE_PLAN}}" >> "$GITHUB_ENV"
          echo "service_account=${{env.FAST_SERVICE_ACCOUNT_PLAN}}" >> "$GITHUB_ENV"

      - id: vars-apply
        if: github.event.pull_request.merged == true && success()
        name: Set up apply variables
        run: |
          echo "provider_file=${{env.TF_PROVIDERS_FILE}}" >> "$GITHUB_ENV"
          echo "service_account=${{env.FAST_SERVICE_ACCOUNT}}" >> "$GITHUB_ENV"

      - id: set-image
        name: Set image tag
        run: |
          if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            echo "image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:pr-${{ github.event.number }}" >> "$GITHUB_ENV"
          fi


      # set up authentication via Workload identity Federation and gcloud

      - id: gcp-auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{env.FAST_WIF_PROVIDER}}
          service_account: ${{env.service_account}}
          access_token_lifetime: 900s

      - id: gcp-sdk
        name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: alpha

      # copy provider file

      - id: tf-config-provider
        name: Copy Terraform provider file
        run: |
          gcloud storage cp -r \
            "gs://kh-prod-iac-core-0-iac-outputs/providers/${{env.provider_file}}" ./
          gcloud storage cp -r \
            "gs://kh-prod-iac-core-0-iac-outputs/tfvars/0-org-setup.auto.tfvars.json" ./
          gcloud storage cp -r \
            "gs://kh-prod-iac-core-0-iac-outputs/tfvars/0-globals.auto.tfvars.json" ./

      - id: tf-setup
        name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{env.TF_VERSION}}

      # run Terraform init/validate/plan

      - id: tf-init
        name: Terraform init
        continue-on-error: true
        run: |
          terraform init -no-color

      - id: tf-validate
        continue-on-error: true
        name: Terraform validate
        run: terraform validate -no-color

      - id: tf-bootstrap-ar
        if: github.event.pull_request.merged == true && success()
        name: Terraform apply (bootstrap Artifact Registry)
        run: |
          terraform apply -input=false -auto-approve -no-color \
            -target=google_project_service.services \
            -target=google_artifact_registry_repository.repo \
            -var="image=${{ env.image }}"

      - id: docker-auth
        if: github.event.pull_request.merged == true && success()
        name: Configure Docker auth for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - id: docker-build-push
        if: github.event.pull_request.merged == true && success()
        name: Build & push Docker image
        run: |
          docker build -t "${{ env.image }}" .
          docker push "${{ env.image }}"


      - id: tf-plan
        name: Terraform plan
        continue-on-error: true
        run: |
          terraform plan -input=false -out ../plan.out -no-color ${{env.plan_opts}} -var="image=${{ env.image }}"

      - id: tf-apply
        if: github.event.pull_request.merged == true && success()
        name: Terraform apply
        continue-on-error: true
        run: |
          terraform apply -input=false -auto-approve -no-color ../plan.out -var="image=${{ env.image }}"

      # PR comment with Terraform result from previous steps
      # length is checked and trimmed for length so as to stay within the limit

      - id: pr-comment
        name: Post comment to Pull Request
        continue-on-error: true
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: ${{steps.tf-plan.outputs.stdout}}\n${{steps.tf-plan.outputs.stderr}}
        with:
          script: |
            const output = `### Terraform Initialization \`${{steps.tf-init.outcome}}\`

            ### Terraform Validation \`${{steps.tf-validate.outcome}}\`

            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${{steps.tf-validate.outputs.stdout}}
            \`\`\`

            </details>

            ### Terraform Plan \`${{steps.tf-plan.outcome}}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${process.env.PLAN.split('\n').filter(l => l.match(/^([A-Z\s].*|)$$/)).join('\n')}
            \`\`\`

            </details>

            ### Terraform Apply \`${{steps.tf-apply.outcome}}\`

            *Pusher: @${{github.actor}}, Action: \`${{github.event_name}}\`, Working Directory: \`${{env.tf_actions_working_dir}}\`, Workflow: \`${{github.workflow}}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - id: pr-short-comment
        name: Post comment to Pull Request (abbreviated)
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && steps.pr-comment.outcome != 'success'
        with:
          script: |
            const output = `### Terraform Initialization \`${{steps.tf-init.outcome}}\`

            ### Terraform Validation \`${{steps.tf-validate.outcome}}\`

            ### Terraform Plan \`${{steps.tf-plan.outcome}}\`

            Plan output is in the action log.

            ### Terraform Apply \`${{steps.tf-apply.outcome}}\`

            *Pusher: @${{github.actor}}, Action: \`${{github.event_name}}\`, Working Directory: \`${{env.tf_actions_working_dir}}\`, Workflow: \`${{github.workflow}}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # exit on error from previous steps

      - id: check-init
        name: Check init failure
        if: steps.tf-init.outcome != 'success'
        run: exit 1

      - id: check-validate
        name: Check validate failure
        if: steps.tf-validate.outcome != 'success'
        run: exit 1

      - id: check-plan
        name: Check plan failure
        if: steps.tf-plan.outcome != 'success'
        run: exit 1

      - id: check-apply
        name: Check apply failure
        if: github.event.pull_request.merged == true && steps.tf-apply.outcome != 'success'
        run: exit 1
